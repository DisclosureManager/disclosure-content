# Hourly news feed for Disclosure Decoded, in the public content repo DisclosureManager/disclosure-content
# (1.3.0 (10): ONE repo for the catalog and News). Layout there:
#   .github/workflows/news-feed.yml  ← this file
#   feed/build_news.py, feed/validate_news.py, feed/validate_sources.py, feed/verify_sources.py,
#   feed/sources.json, feed/summaries.json, feed/state/news-state.json (ETags), feed/fixtures/, feed/tests/
#   news.json (output, repo root, next to manifest.json / entries.json / glossary.json)
# The app reads https://raw.githubusercontent.com/DisclosureManager/disclosure-content/main/news.json
# (ContentConfig.newsURL). The app repo keeps the master copy in feed/workflows/ (GitHub does not run it there).
# Uses only the built-in GITHUB_TOKEN (contents: write); no secrets.
name: news-feed

on:
  schedule:
    - cron: '17 * * * *'      # hourly, off the hour
  workflow_dispatch: {}

concurrency:
  group: news-feed
  cancel-in-progress: true

permissions:
  contents: write              # commit news.json to this repo only

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5         # aim: about 1 minute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources.json (ADM-approved list; feeds only, no paywalls, at most 2 advocacy)
        run: python3 feed/validate_sources.py feed/sources.json
      - name: Build news.json (conditional fetches, last good items kept per source)
        run: python3 feed/build_news.py --sources feed/sources.json --summaries feed/summaries.json --state feed/state/news-state.json --out news.json
      - name: Validate (source URL required, summary <= 160, no body/content)
        run: python3 feed/validate_news.py news.json
      - name: Commit only when the items changed
        run: |
          if git diff --quiet -- news.json && [ -n "$(git ls-files news.json)" ]; then
            echo "news.json unchanged: nothing to commit"
            exit 0
          fi
          git config user.name "disclosure-news bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json feed/state/news-state.json
          git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main   # a catalog commit may have landed meanwhile
          git push origin HEAD:main
